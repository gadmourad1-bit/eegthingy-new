[project]
name = "benchmark"
version = "0.1.0"
description = "Reproducible cross-dataset EEG benchmark"
requires-python = "==3.12.13"
dependencies = [
    "braindecode==1.6.1",
    "einops==0.8.2",
    "matplotlib==3.10.9",
    "mne==1.12.1",
    "moabb==1.5.0",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "pyriemann==0.11",
    "scikit-learn==1.8.0",
    "scipy==1.18.0",
    "threadpoolctl==3.6.0",
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
]

[dependency-groups]
test = [
    "pytest==9.0.2",
]
docs = [
    "pdfplumber==0.11.10",
    "pypdf==6.14.2",
    "reportlab==5.0.0",
]

[tool.uv]
package = false
default-groups = []
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
